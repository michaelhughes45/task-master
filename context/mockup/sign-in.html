<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ts *{box-sizing:border-box}
.ts button,.ts input{font:inherit;color:inherit}
.ts button{cursor:pointer;margin:0}
a{color:#1A55C9}a:hover{color:#173F8C}
</style>
</helmet>
<div class="ts" style="{{rootVars}} width: 1200px; height: 760px; display: flex; align-items: center; justify-content: center; padding: 32px; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.45">
<div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="30" height="30" viewBox="0 0 26 26" aria-hidden="true"><rect x="0" y="0" width="26" height="26" rx="6" fill="#1D5BD6"></rect><path d="M7 13.5l4 4L19.5 9" fill="none" stroke="#7FE0AA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-size: 19px; font-weight: 600; letter-spacing: -0.01em">Task Master</span>
</div>
<div style="padding: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; gap: 18px">
<div>
<h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Sign in</h1>
<p style="margin: 4px 0 0; font-size: 14px; color: var(--muted)">Pick up where you left off.</p>
</div>
<button type="button" style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 15px; font-weight: 500">Continue with Google</button>
<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted)"><span style="flex: 1; height: 1px; background: var(--border)"></span>or<span style="flex: 1; height: 1px; background: var(--border)"></span></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 500">Email<input type="email" autocomplete="email" placeholder="you@example.com" style="height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-size: 15px"></label>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><label for="ts-pw" style="font-size: 13.5px; font-weight: 500">Password</label><a href="#" style="font-size: 13px; color: var(--accent-text); text-decoration: none">Forgot password?</a></div>
<input id="ts-pw" type="password" autocomplete="current-password" style="height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-size: 15px">
</div>
<button type="button" style="height: 44px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 600">Sign in</button>
</div>
<p style="margin: 0; text-align: center; font-size: 14px; color: var(--muted)">New here? <a href="#" style="color: var(--accent-text); font-weight: 500; text-decoration: none">Create an account</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const t = dark ? {
      bg: '#0D1015', surface: '#141920', border: '#29303B', text: '#E5E8ED', muted: '#9BA5B4',
      accent: '#2D64D8', 'on-accent': '#FFFFFF', 'accent-text': '#8AB0FF'
    } : {
      bg: '#F4F6F9', surface: '#FFFFFF', border: '#DFE3EA', text: '#141922', muted: '#576072',
      accent: '#1D5BD6', 'on-accent': '#FFFFFF', 'accent-text': '#1A55C9'
    };
    return { rootVars: Object.keys(t).map((k) => '--' + k + ': ' + t[k] + ';').join(' ') + ' color-scheme: ' + (dark ? 'dark' : 'light') + ';' };
  }
}
</script>
</body>
</html>
